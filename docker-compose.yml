version: '3'
services:
    ebot-web:
        image: ghcr.io/npetersendk/ebot-csgo-web:latest
        restart: always
        environment:
            - EBOT_ADMIN_LOGIN
            - EBOT_ADMIN_PASSWORD
            - EBOT_ADMIN_EMAIL
            - EBOT_ADMIN_FIRSTNAME
            - EBOT_ADMIN_LASTNAME
            - MYSQL_HOST=mysqldb
            - MYSQL_DATABASE
            - MYSQL_USER
            - MYSQL_PASSWORD
        volumes:
            - "eBotWebVolume:/app/eBot-CSGO-Web"
            - "./ebot-logs:/app/ebot-logs"
            - "./ebot-demos:/app/ebot-demos"
            - "./etc/eBotWeb/app_user.yml:/app/eBot-CSGO-Web/config/app_user.yml"
            - "./etc/eBotWeb/app.yml:/app/eBot-CSGO-Web/config/app.yml"
            - "./etc/eBotWeb/databases.yml:/app/eBot-CSGO-Web/config/databases.yml"
        depends_on:
            - mysqldb

    ebot-socket:
        image: "ghcr.io/npetersendk/ebot-csgo:latest"
        restart: always
        ports:
            - "12360:12360"
        volumes:
            - "./ebot-logs:/app/eBot-CSGO/logs"
            - "./ebot-demos:/app/eBot-CSGO/demos"
            - "./etc/eBotSocket/config.ini:/app/config/config.ini"
        depends_on:
            - mysqldb
            - ebot-web
            - redis
    ebot-logs-receiver:
        image: ghcr.io/npetersendk/ebot-project:latest
        restart: always
        ports:
            - "12345:12345"
        volumes:
            - "./etc/eBotLogReceiver/config.json:/app/ebot-project/configs/config.json"
        depends_on:
            - redis
    mysqldb:
        image: biarms/mysql:5.7
        restart: always
        environment:
            - MYSQL_DATABASE
            - MYSQL_ROOT_PASSWORD
            - MYSQL_USER
            - MYSQL_PASSWORD
        volumes:
            - "./data/db/mysql:/var/lib/mysql"
    redis:
        image: redis:alpine
        restart: always
        volumes:
            - ./data/redis:/data
    nginx:
        image: nginx:alpine
        volumes:
            - "./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf"
            - "eBotWebVolume:/app/eBot-CSGO-Web"
        ports:
            - "80:80"
            - "443:443"
        restart: always
        depends_on:
            - ebot-web
            - mysqldb
volumes:
  eBotWebVolume: